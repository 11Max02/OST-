<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Carousel Project</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background-color: #0b0e14;
      background-image: radial-gradient(circle at center 20%, #1a2c5a 0%, #0b0e14 70%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: 100% 100%;
      padding: 50px 5%;
    }

    .container {
      position: relative;
      height: 100%;
      background-color: #0b0e14;
      background-image: radial-gradient(circle at center 20%, #1a2c5a 0%, #0b0e14 70%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: 100% 100%;
      border-radius: 30px;
      backdrop-filter: blur(30px);
      transform: scale(0);
      animation: zoom-in 1s ease forwards;
    }

    @keyframes zoom-in {
      100% {
        transform: scale(1);
      }
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 25px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }

    .navbar a {
      font-size: 18px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      margin-left: 35px;
      border-bottom: 2px solid transparent;
      transition: .5s;
    }

    .navbar a:hover,
    .navbar a.active {
      border-color: #fff;
    }

    .project {
      margin: 40px auto;
      width: 90%;
      overflow: hidden;
      position: relative;
    }

    .slideshow {
      display: flex;
      width: max-content;
      margin-top: 100px;
      animation: scroll 20s linear infinite;
    }

    .card {
      flex: 0 0 auto;
      width: 220px;
      height: 150px;
      margin: 0 10px;
      background: #eee;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
    }

    /* Infinite scroll keyframes */
    @keyframes scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    /* Pause on hover */
    .project:hover .slideshow {
      animation-play-state: paused;
    }

    /* Modal styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 400px;
      text-align: center;
    }

    .close {
      float: right;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <a href="" class="logo">MR</a>
      <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="project.html" class="active">Project</a>
        <a href="">Contact</a>
      </nav>
    </header>

    <section class="project">
      <div class="slideshow" id="carousel">
        <!-- Original cards -->

        <div class="card"
          onclick="openModal('Catch the Ball', 'This game was simple you need to move the bar using arrow left and right to catch the ball', 'images/catch-ball.png')">
          <img src="images/catch-ball.png" alt="Catch the Ball"
            style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
        </div>

        <div class="card"
          onclick="openModal('Project Two', 'This is the second project description.', 'images/project2.png')">
          <img src="images/project2.png" alt="Project Two"
            style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
        </div>

        <div class="card" onclick="openModal('Project Two', 'This is the second project description.')">Project Two
        </div>
        <div class="card" onclick="openModal('Project Three', 'This is the third project description.')">Project Three
        </div>
        <div class="card" onclick="openModal('Project Four', 'This is the fourth project description.')">Project Four
        </div>

        <!-- Duplicate cards for seamless loop -->
        <div class="card"
          onclick="openModal('Catch the Ball', 'This game was simple you need to move the bar using arrow left and right to catch the ball', 'images/catch-ball.png')">
          <img src="images/catch-ball.png" alt="Catch the Ball"
            style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
        </div>
        <div class="card" onclick="openModal('Project Two', 'This is the second project description.')">Project Two
        </div>
        <div class="card" onclick="openModal('Project Three', 'This is the third project description.')">Project Three
        </div>
        <div class="card" onclick="openModal('Project Four', 'This is the fourth project description.')">Project Four
        </div>
      </div>
    </section>

    <!-- Popup Modal -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <img id="modal-image" src="" alt="" style="width:100%; border-radius:8px; margin:15px 0;">
        <p id="modal-description"></p>
      </div>
    </div>

  </div>

  <script>
    // Modal functions
    function openModal(title, description) {
      document.getElementById("modal-title").innerText = title;
      document.getElementById("modal-description").innerText = description;
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    // Close modal when clicking outside
    window.onclick = function (event) {
      const modal = document.getElementById("modal");
      if (event.target === modal) {
        modal.style.display = "none";
      }
    }

    function openModal(title, description, imageSrc) {
  document.getElementById("modal-title").innerText = title;
  document.getElementById("modal-description").innerText = description;
  document.getElementById("modal-image").src = imageSrc;
  document.getElementById("modal").style.display = "flex";
}

  </script>
</body>

</html>
